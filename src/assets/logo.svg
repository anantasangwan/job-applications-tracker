<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100" height="100">
  <defs>
    <!-- Import Archivo Black for a very bold modern look -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&amp;display=swap');
      
      .logo-letter {
        font-family: "Archivo Black", sans-serif;
        font-weight: 700;
        font-size: 130px;
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>

    <!-- Subtle Drop Shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Rounded Square with "carorl pink" / coral pink color -->
  <rect x="15" y="15" width="150" height="150" rx="42" fill="#F88379" filter="url(#soft-shadow)" />

  <!-- Very Bold 'J' -->
  <!-- Centered inside the 200x200 canvas (x: 100, y: 105 to optically balance the hook of the J) -->
  <text x="90" y="90" class="logo-letter">J</text>
</svg>
